<!DOCTYPE html>
<html>
<head>
  <title>AI Translator Settings</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <div class="container">
    <h1>AI Translator Settings</h1>
    
    <div class="section">
      <h2>API Configuration</h2>
      <div class="form-group">
        <label for="api-key">API Key:</label>
        <input type="password" id="api-key" placeholder="Enter your API key">
      </div>
      <div class="form-group">
        <label for="api-url">API Endpoint (optional):</label>
        <input type="text" id="api-url" placeholder="https://api.example.com/v1/chat/completions">
      </div>
    </div>

    <div class="section">
      <h2>Language Settings</h2>
      <div class="form-group">
        <label for="source-language">Source Language:</label>
        <select id="source-language">
          <option value="auto">Auto-detect</option>
          <option value="en">English</option>
          <option value="fr">French</option>
          <option value="es">Spanish</option>
          <option value="de">German</option>
          <option value="it">Italian</option>
          <option value="pt">Portuguese</option>
          <option value="ru">Russian</option>
          <option value="ja">Japanese</option>
          <option value="zh">Chinese</option>
          <option value="ko">Korean</option>
          <option value="ar">Arabic</option>
        </select>
      </div>
      <div class="form-group">
        <label for="target-language">Target Language:</label>
        <select id="target-language">
          <option value="en">English</option>
          <option value="fr">French</option>
          <option value="es">Spanish</option>
          <option value="de">German</option>
          <option value="it">Italian</option>
          <option value="pt">Portuguese</option>
          <option value="ru">Russian</option>
          <option value="ja">Japanese</option>
          <option value="zh">Chinese</option>
          <option value="ko">Korean</option>
          <option value="ar">Arabic</option>
        </select>
      </div>
    </div>

    <div class="section">
      <h2>Prompt Settings</h2>
      <div class="form-group">
        <label for="custom-prompt">Custom Translation Prompt:</label>
        <textarea id="custom-prompt" rows="5" placeholder="Translate the following text from {source_language} to {target_language}: {text}"></textarea>
      </div>
      <div class="help-text">
        Use placeholders: {source_language}, {target_language}, {text} to dynamically insert values.
      </div>
    </div>

    <div class="section">
      <h2>Display Settings</h2>
      <div class="form-group">
        <label for="icon-position">Icon Position:</label>
        <select id="icon-position">
          <option value="top-right">Top Right</option>
          <option value="top-left">Top Left</option>
          <option value="bottom-right">Bottom Right</option>
          <option value="bottom-left">Bottom Left</option>
        </select>
      </div>
    </div>

    <div class="button-container">
      <button id="save-btn">Save Settings</button>
      <div id="status"></div>
    </div>
  </div>
  <script src="options.js"></script>
</body>
</html>
